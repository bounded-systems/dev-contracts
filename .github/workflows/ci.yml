name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: type-check
        run: deno check mod.ts spec/mod.ts
      - name: test
        run: deno test --allow-read --allow-net --allow-write spec/
      - name: publish dry-run
        run: deno publish --dry-run
